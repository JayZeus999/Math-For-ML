<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#fbfcfe"/>
  <text x="550" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Two input features → one regression plane</text>
  <text x="550" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52627a">Each point is one example: (x₁, x₂, actual label y)</text>
  <!-- floor grid -->
  <g stroke="#c8d3e0" stroke-width="1.5">
    <path d="M210 555 L670 555 L875 425 L415 425 Z" fill="#f1f5f9"/>
    <path d="M256 555 L461 425 M302 555 L507 425 M348 555 L553 425 M394 555 L599 425 M440 555 L645 425 M486 555 L691 425 M532 555 L737 425 M578 555 L783 425 M624 555 L829 425"/>
    <path d="M256 526 L716 526 M302 497 L762 497 M348 468 L808 468 M394 439 L854 439"/>
  </g>
  <!-- plane -->
  <path d="M278 385 L686 385 L840 290 L432 290 Z" fill="#48a9a6" fill-opacity=".68" stroke="#147d7a" stroke-width="3"/>
  <!-- plane grid -->
  <g stroke="#197f7d" stroke-width="1.2" opacity=".7">
    <path d="M329 385 L483 290 M380 385 L534 290 M431 385 L585 290 M482 385 L636 290 M533 385 L687 290 M584 385 L738 290 M635 385 L789 290"/>
    <path d="M329 373 L737 373 M380 361 L788 361 M431 349 L814 333 M406 306 L814 306"/>
  </g>
  <!-- axes -->
  <g stroke="#24364b" stroke-width="3" fill="none">
    <path d="M210 555 L710 555"/><path d="M210 555 L425 420"/><path d="M210 555 L210 190"/>
    <path d="M710 555 l-14 -8 m14 8 l-14 8"/><path d="M425 420 l-16 2 m16 -2 l-7 14"/><path d="M210 190 l-8 15 m8 -15 l8 15"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#24364b">
    <text x="690" y="590">Feature 1 (x₁)</text><text x="414" y="407">Feature 2 (x₂)</text><text x="166" y="185">Label / prediction (y)</text>
  </g>
  <!-- sample points above/below plane with guides -->
  <g stroke="#66788f" stroke-width="1.5" stroke-dasharray="5 5">
    <path d="M390 475 L390 345"/><path d="M528 493 L528 352"/><path d="M620 440 L620 325"/><path d="M724 465 L724 355"/><path d="M460 430 L460 310"/>
  </g>
  <g fill="#ed6a5a" stroke="white" stroke-width="3">
    <circle cx="390" cy="345" r="10"/><circle cx="528" cy="352" r="10"/><circle cx="620" cy="325" r="10"/><circle cx="724" cy="355" r="10"/><circle cx="460" cy="310" r="10"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#34445a">
    <text x="755" y="315" fill="#c34f42" font-weight="700">Observed data points</text>
    <path d="M748 320 L728 346" stroke="#c34f42" stroke-width="2"/>
    <text x="665" y="255" fill="#147d7a" font-weight="700">One model: ŷ = w₁x₁ + w₂x₂ + b</text>
    <text x="570" y="635">The two weights set the plane’s tilt; b shifts it up or down.</text>
    <text x="570" y="663">Training adjusts this single plane to fit all examples overall.</text>
  </g>
</svg>
